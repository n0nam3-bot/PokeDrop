name: Extract uploaded ZIP

on:
  push:
    paths:
      - "uploads/*.zip"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: extract-upload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP uploads into repository folders
        run: python3 scripts/extract-upload.py

      - name: Commit extracted files and trigger Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract uploaded repository ZIP"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
